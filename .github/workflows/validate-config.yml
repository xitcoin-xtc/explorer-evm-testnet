name: Validate explorer configuration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-explorer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Compose and security invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Prepare non-secret validation environment
        shell: bash
        run: |
          set -euo pipefail
          sed 's/=$/=validation-only-not-a-secret/' server/.env.example > server/.env

      - name: Validate Compose configuration
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f server/compose.json config --quiet

      - name: Validate security invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          raw = open("server/compose.json").read()
          c = json.loads(raw)
          for name, s in c["services"].items():
              for p in s.get("ports", []):
                  assert p.startswith("127.0.0.1:"), (name, p)
              assert s.get("pull_policy") == "never", name
          for var in ("POSTGRES_PASSWORD", "STATS_POSTGRES_PASSWORD", "SECRET_KEY_BASE"):
              assert "${%s}" % var in raw, var
          assert not re.search(r"postgres(ql)?://[^:/]+:(?!\$\{)[^@]+@", raw), "literal database password"
          assert c["services"]["backend"]["environment"]["BLOCKSCOUT_HOST"] == "evm-explorer-testnet.xitchain.com"
          pub = json.load(open("server/frontend-public.json"))
          m = re.match(r"^window\.__envs = (.*);\s*$", open("server/envs.js").read(), re.S)
          assert m and json.loads(m.group(1)) == pub, "envs.js and frontend-public.json differ"
          print("ok")
          PY
